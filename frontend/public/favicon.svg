<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Markdown">
  <title>Markdown</title>
  <!-- The canonical Markdown mark by Dustin Curtis (CC0). Classes are
       split into frame (stroked outline, NO fill) and glyph (filled
       M-arrow) — a single shared class previously set fill on the
       frame rect, and SVG CSS beats the fill="none" attribute, which
       rendered the icon as a solid blob covering the glyph. -->
  <defs>
    <style>
      .bg    { fill: #ffffff; }
      .frame { fill: none; stroke: #0f172a; stroke-width: 12; }
      .glyph { fill: #0f172a; }
      @media (prefers-color-scheme: dark) {
        .bg    { fill: #0b1220; }
        .frame { stroke: #e5e7eb; }
        .glyph { fill: #e5e7eb; }
      }
    </style>
  </defs>
  <rect class="bg" width="256" height="256" rx="40" />
  <g transform="translate(24,64)">
    <rect class="frame" x="5" y="5" width="198" height="118" rx="14" />
    <path class="glyph" d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z" />
  </g>
</svg>
